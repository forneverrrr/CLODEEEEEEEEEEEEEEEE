<script>
(function(){
"use strict";
var app=document.getElementById("app");
var SHEETS=DATA.sheets, TL=DATA.timeline;
var SRC=function(s,p){return (s===27?"Ordliste":"Fakta-ark "+s)+" · s. "+p;};
function srcOf(it){return it.src||(it.s?SRC(it.s,it.p):"Tidslinje · s. "+it.p);}
var STORE_KEY="mbp-ovebank-v1";
var store={stat:{},pos:0,best:null,sets:{}};
try{var raw=localStorage.getItem(STORE_KEY);if(raw){var o=JSON.parse(raw);if(o&&o.stat){store=o;if(!store.sets)store.sets={};}}}catch(e){}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}}

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
var ALL=[];
SHEETS.forEach(function(sh){sh.q.forEach(function(r,i){
  ALL.push({type:"mc",id:sh.n+":"+i,s:sh.n,q:r[0],right:r[1],wrongs:r.slice(2,r.length-1),p:r[r.length-1]});
});});
var BYID={};ALL.forEach(function(x){BYID[x.id]=x;});
function sheetItems(n){return ALL.filter(function(x){return x.s===n;});}
function rec(id,ok){var s=store.stat[id]||{c:0,w:0,l:1};if(ok)s.c++;else s.w++;s.l=ok?1:0;store.stat[id]=s;}
function mastered(){var n=0;ALL.forEach(function(x){var s=store.stat[x.id];if(s&&s.l===1)n++;});return n;}
function wrongIds(){return ALL.filter(function(x){var s=store.stat[x.id];return s&&s.l===0;});}

/* ---------- timeline item generators ---------- */
function distinctYears(n,minGap){
  for(var tries=0;tries<200;tries++){
    var pick=shuffle(TL).slice(0,n);
    var ok=true;
    for(var i=0;i<n&&ok;i++)for(var j=i+1;j<n;j++){if(Math.abs(pick[i][0]-pick[j][0])<minGap){ok=false;break;}}
    if(ok)return pick;
  }
  return shuffle(TL).slice(0,n);
}
function genDate(kind){
  if(kind==="year"){
    var e=TL[Math.floor(Math.random()*TL.length)];
    var others=TL.filter(function(x){return x[1]!==e[1];}).sort(function(a,b){return Math.abs(a[0]-e[0])-Math.abs(b[0]-e[0]);});

  }

var Q=null;
function startQuiz(cfg){
  var items=cfg.items.map(function(it){
    var c=Object.assign({},it);
    if(c.type==="mc"){
      var w=c.wrongs;
      if(cfg.exam)w=shuffle(w).slice(0,2);
      c.opts=shuffle([c.right].concat(w));
    }else{c.shown=shuffle(c.events);}
    return c;
  });
  Q={cfg:cfg,items:items,i:0,ans:items.map(function(){return null;}),done:items.map(function(){return false;}),t0:Date.now(),total:cfg.seconds||1800,left:cfg.exam?(cfg.seconds||1800):0,timer:null,finished:false};
  if(cfg.exam){Q.timer=setInterval(tick,1000);}
  renderQuiz();
}
function tick(){
  if(!Q||Q.finished){return;}
  Q.left=Math.max(0,Q.total-Math.floor((Date.now()-Q.t0)/1000));
  var t=document.getElementById("timer");
  if(t){t.textContent=fmt(Q.left);t.classList.toggle("low",Q.left<=300);}

}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function isRight(it,a){
  if(a===null)return false;
  if(it.type==="mc")return a===it.right;

}
function renderQuiz(){

  h+='<div class="prog"><div class="bar"><i style="width:'+Math.round((Q.i+(done?1:0))/n*100)+'%"></i></div>'+(exam?'<span class="mono" style="font-size:13px">'+(Q.i+1)+'/'+n+'</span>':'')+'</div>';
  h+='<div class="card'+(it.s?' g'+gcl(it.s):'')+'"><div class="q" id="qq">'+esc(it.q)+'</div>';

  if(it.type==="mc"){
    h+='<div class="opts" role="group" aria-label="Svarmuligheder">';
    it.opts.forEach(function(o,k){
      var cls="opt";
      if(exam){if(a===o)cls+=" sel";}
      else if(done){if(o===it.right)cls+=" ok";else if(o===a)cls+=" bad";}
      h+='<button class="'+cls+'" data-o="'+k+'"'+((!exam&&done)?' disabled':'')+'><span class="k">'+"ABCD"[k]+'</span><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
    if(!exam&&done){
      var ok=a===it.right;
      h+='<div class="fb '+(ok?'ok':'bad')+'" role="status">'+(ok?'<b>Rigtigt.</b>':'<b>Forkert.</b> Rigtigt svar: '+esc(it.right))+'</div>';
      if(it.dates){h+='<div class="fb">'+it.dates.map(function(d){return esc(d[1])+' – '+esc(d[2]);}).join('<br>')+'</div>';}
    }

      var num=(!exam&&done)?String(it.events.indexOf(e)+1):(pos>=0?String(pos+1):"");
      h+='<button class="'+cls+'" data-e="'+esc(e[2])+'"'+((!exam&&done)?' disabled':'')+'><span class="n">'+num+'</span><span>'+esc(e[2])+((!exam&&done)?'<span class="d">'+esc(e[1])+'</span>':'')+'</span></button>';
    });

    if(!(done&&!exam)){h+='<div class="row"><button class="btn ghost" id="clr">Ryd</button>'+(exam?'':'<button class="btn" id="chk"'+(picked.length===it.events.length?'':' disabled')+'>Tjek rækkefølge</button>')+'</div>';}
    else{var ok2=isRight(it,a);h+='<div class="fb '+(ok2?'ok':'bad')+'" role="status">'+(ok2?'<b>Rigtigt.</b>':'<b>Forkert.</b> Den rigtige rækkefølge ses i tallene ovenfor.')+'</div>';}
  }
  h+='</div>';
  h+='<div class="nav">';
  if(exam){
    h+='<button class="btn ghost" id="prev"'+(Q.i===0?' disabled':'')+'>← Forrige</button>';
    if(Q.i<n-1)h+='<button class="btn" id="next">Næste →</button>';
    else h+='<button class="btn red" id="fin">Aflever prøven</button>';
  }else{
    h+='<span></span>';

    h+='<button class="btn" id="next"'+(can?'':' disabled')+'>'+(Q.i<n-1?'Næste →':'Se resultat')+'</button>';
  }
  h+='</div>';
  if(exam){
    h+='<div class="dots">';
    Q.items.forEach(function(x,k){h+='<button class="dot'+(Q.ans[k]!==null?' done':'')+(k===Q.i?' cur':'')+'" data-j="'+k+'" aria-label="Spørgsmål '+(k+1)+'">'+(k+1)+'</button>';});
    h+='</div>';

  app.innerHTML=h;

function bindQuiz(){
  var it=Q.items[Q.i],exam=Q.cfg.exam;
  document.getElementById("x").onclick=function(){if(Q.timer)clearInterval(Q.timer);Q=null;home();};
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){choose(+b.getAttribute("data-o"));};});
  Array.prototype.forEach.call(app.querySelectorAll(".ev"),function(b){b.onclick=function(){pickEv(b.getAttribute("data-e"));};});
  var nx=document.getElementById("next");if(nx)nx.onclick=next;
  var pv=document.getElementById("prev");if(pv)pv.onclick=function(){go(Q.i-1);};
  var fn=document.getElementById("fin");if(fn)fn.onclick=function(){confirmFinish();};
  var cl=document.getElementById("clr");if(cl)cl.onclick=function(){Q.ans[Q.i]=null;renderQuiz();};
  var ck=document.getElementById("chk");if(ck)ck.onclick=function(){grade();};
  Array.prototype.forEach.call(app.querySelectorAll(".dot"),function(b){b.onclick=function(){go(+b.getAttribute("data-j"));};});
}
function go(k){if(k>=0&&k<Q.items.length){Q.i=k;renderQuiz();window.scrollTo(0,0);}}
function choose(k){
  var it=Q.items[Q.i];if(Q.cfg.exam){Q.ans[Q.i]=it.opts[k];renderQuiz();return;}
  if(Q.done[Q.i])return;
  Q.ans[Q.i]=it.opts[k];Q.done[Q.i]=true;
  var ok=it.opts[k]===it.right;if(!it.nostat)rec(it.id,ok);save();renderQuiz();
}
function pickEv(name){
  if(!Q.cfg.exam&&Q.done[Q.i])return;
  var a=(Q.ans[Q.i]||[]).slice(),k=a.indexOf(name);

}
function grade(){Q.done[Q.i]=true;renderQuiz();}
function next(){
  if(Q.cfg.exam){go(Q.i+1);return;}
  if(!Q.done[Q.i])return;
  if(Q.i<Q.items.length-1){Q.i++;if(Q.cfg.saveOrder){store.pos=Q.cfg.base+Q.i;save();}renderQuiz();window.scrollTo(0,0);}

function confirmFinish(){

  if(Q.cfg.exam){var prev=store.best;if(prev===null||pct>prev)store.best=pct;}

  h+='<div class="card"><div class="score"><b class="mono">'+right+'</b><span>af '+n+' rigtige · '+pct+'%</span></div>';

  h+='<div class="row">';

  h+='<button class="btn ghost" id="again">Ny omgang</button></div></div>';

    h+='<h2>Dine fejl</h2><div class="rev">';

      h+='</div>';
    });

}

  };
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){go2(b.getAttribute("data-v"));};});
  if(view==="start"){
    Array.prototype.forEach.call(document.querySelectorAll("#len .chip"),function(b){b.onclick=function(){window.__len=+b.getAttribute("data-n");home();};});
    Array.prototype.forEach.call(document.querySelectorAll("#eras .chip"),function(b){b.onclick=function(){window.__era=+b.getAttribute("data-e");var y=window.scrollY;home();window.scrollTo(0,y);};});
    document.getElementById("m-exam").onclick=runExam;
    document.getElementById("m-seq").onclick=function(){
      var base=(store.pos>0&&store.pos<total)?store.pos:0;
      startQuiz({title:"Hele bogen i rækkefølge",items:ALL.slice(base),saveOrder:true,base:base,rerun:function(){store.pos=0;save();home();}});
    };
    document.getElementById("m-shuf").onclick=runShuffle;
    document.getElementById("m-date").onclick=runDates;
    var wb=document.getElementById("m-wr");if(!wb.disabled)wb.onclick=function(){startQuiz({title:"Mine fejl",items:shuffle(wrongIds()),rerun:home});};
    Array.prototype.forEach.call(document.querySelectorAll(".seg"),function(b){b.onclick=function(){
      var n=+b.getAttribute("data-ch");
      startQuiz({title:n===27?"Ordliste":"Fakta-ark "+n,items:sheetItems(n),rerun:function(){b.onclick();}});
    };});
  }
  if(view==="tid")document.getElementById("go").onclick=runDates;
  if(view==="prover")Array.prototype.forEach.call(document.querySelectorAll("[data-set]"),function(b){b.onclick=function(){
    var st=DATA.sets[+b.getAttribute("data-set")],ex=b.getAttribute("data-x")==="1";
    startQuiz({title:st.name+(ex?"":" · øv"),items:st.items.map(function(x){return Object.assign({type:"mc"},x);}),exam:ex,setName:st.name,rerun:function(){b.onclick();}});
  };});
  if(view==="emner")bindBuilder();
}
var GROUPS=[["Skole og arbejde",[1,2,3,4,5]],["Samfund og familie",[6,7,8,9,10]],["Demokrati og retssamfund",[11,12,13,14,15,16]],["Religion og omverden",[17,18,19]],["Historie",[20,21]],["Kultur og traditioner",[22,23]],["Forsvar, diskrimination og klima",[24,25,26]],["Ordliste",[27]]];
if(!store.sel)store.sel=[];
if(!store.bset)store.bset={order:"seq",n:0,mode:"practice"};
function isSel(n){return store.sel.indexOf(n)>=0;}
function builderHtml(){
  var h='<section class="sec" id="builder"><h1 style="font-size:clamp(32px,8vw,52px)">Vælg emner</h1><p style="color:var(--muted);font-size:14px">Tryk på et eller flere emner. Vælg derefter rækkefølge, antal og tilstand nederst, og tryk Start.</p><div class="row"><button class="chip" id="sel-all">Vælg alle</button><button class="chip" id="sel-none">Fravælg alle</button></div>';
  GROUPS.forEach(function(g,gi){
    h+='<div class="grp g'+(gi+1)+'"><div class="grp-h"><span class="gh">'+icon(gi)+'<h3>'+esc(g[0])+'</h3></span><button class="chip" data-g="'+gi+'">Vælg gruppen</button></div><div class="tiles">';
    g[1].forEach(function(n){
      var sh=SHEETS.filter(function(x){return x.n===n;})[0],its=sheetItems(n);
      var ok=its.filter(function(x){var t=store.stat[x.id];return t&&t.l===1;}).length;
      h+='<button class="tile pick g'+(gi+1)+'" data-s="'+n+'" aria-pressed="'+(isSel(n)?'true':'false')+'"><span class="top"><span class="cb" aria-hidden="true"></span><span class="no">'+(n===27?'ORD':String(n).padStart(2,"0"))+'</span><span class="tt">'+esc(sh.title)+'</span></span><span class="bar"><i style="width:'+Math.round(ok/its.length*100)+'%"></i></span><span class="meta"><span>'+its.length+' spørgsmål</span><span>s. '+sh.pages+'</span></span></button>';
    });
    h+='</div></div>';
  });
  var bs=store.bset;
  function pk(name,opts,cur){return '<div class="row"><span class="lbl">'+({order:"Rækkefølge",n:"Antal",mode:"Tilstand"})[name]+'</span><div class="picker" data-p="'+name+'">'+opts.map(function(o){return '<button class="chip" data-v="'+o[0]+'" aria-pressed="'+(String(cur)===String(o[0])?'true':'false')+'">'+o[1]+'</button>';}).join("")+'</div></div>';}
  h+='<div class="settings">'+pk("order",[["seq","I bogens rækkefølge"],["shuf","Blandet"]],bs.order)+pk("n",[[10,"10"],[25,"25"],[50,"50"],[100,"100"],[0,"Alle valgte"]],bs.n)+pk("mode",[["practice","Øv: svar med det samme"],["exam","Som eksamen: tid, svar til sidst"]],bs.mode)+'</div>';
  h+='</section><div class="startbar"><span id="sum" class="mono"></span><button class="btn red" id="go-sel">Start</button></div>';
  return h;
}
function selCount(){var c=0;store.sel.forEach(function(n){c+=sheetItems(n).length;});return c;}
function updSum(){
  var c=selCount(),n=store.bset.n,use=n&&n<c?n:c;
  var sm=document.getElementById("sum"),go=document.getElementById("go-sel");
  if(!sm)return;
  sm.textContent=store.sel.length?store.sel.length+" emner · "+use+" af "+c+" spørgsmål":"Ingen emner valgt";
  go.disabled=!store.sel.length;
}
function bindBuilder(){
  Array.prototype.forEach.call(document.querySelectorAll(".pick"),function(b){b.onclick=function(){
    var n=+b.getAttribute("data-s"),k=store.sel.indexOf(n);
    if(k>=0)store.sel.splice(k,1);else store.sel.push(n);
    b.setAttribute("aria-pressed",k>=0?"false":"true");save();updSum();
  };});
  function setAll(arr){store.sel=arr.slice();Array.prototype.forEach.call(document.querySelectorAll(".pick"),function(b){b.setAttribute("aria-pressed",isSel(+b.getAttribute("data-s"))?"true":"false");});save();updSum();}
  document.getElementById("sel-all").onclick=function(){setAll(SHEETS.map(function(x){return x.n;}));};
  document.getElementById("sel-none").onclick=function(){setAll([]);};
  Array.prototype.forEach.call(document.querySelectorAll("[data-g]"),function(b){b.onclick=function(){
    var g=GROUPS[+b.getAttribute("data-g")][1],all=g.every(isSel);
    var cur=store.sel.filter(function(n){return g.indexOf(n)<0;});
    setAll(all?cur:cur.concat(g));
  };});
  Array.prototype.forEach.call(document.querySelectorAll(".picker[data-p]"),function(p){
    var key=p.getAttribute("data-p");
    Array.prototype.forEach.call(p.querySelectorAll(".chip"),function(b){b.onclick=function(){
      var v=b.getAttribute("data-v");store.bset[key]=key==="n"?+v:v;
      Array.prototype.forEach.call(p.querySelectorAll(".chip"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
      save();updSum();
    };});
  });
  document.getElementById("go-sel").onclick=startSel;
  updSum();
}
function startSel(){
  if(!store.sel.length)return;
  var nums=store.sel.slice().sort(function(a,b){return a-b;}),items=[];
  nums.forEach(function(n){items=items.concat(sheetItems(n));});
  var bs=store.bset;
  if(bs.order==="shuf")items=shuffle(items);
  if(bs.n&&bs.n<items.length)items=items.slice(0,bs.n);
  var ex=bs.mode==="exam";
  var title=nums.length===1?(nums[0]===27?"Ordliste":"Fakta-ark "+nums[0]):"Egne emner ("+nums.length+")";
  startQuiz({title:title,items:items,exam:ex,seconds:Math.max(60,items.length*72),rerun:startSel});
}
function runExam(){
  var per=Math.floor(25/26),pick=[];
  var mainSheets=SHEETS.filter(function(s){return s.n<27;});
  var pool=shuffle(mainSheets.map(function(s){return s.n;}));
  pool.slice(0,25).forEach(function(n){var its=shuffle(sheetItems(n));pick.push(its[0]);});
  startQuiz({title:"Prøve",items:shuffle(pick),exam:true,rerun:runExam});
}
function runShuffle(){
  var n=window.__len===undefined?50:window.__len;
  var items=shuffle(ALL);if(n)items=items.slice(0,n);
  startQuiz({title:"Hele bogen blandet",items:items,rerun:runShuffle});
}
function runDates(){startQuiz({title:"Årstal og begivenheder",items:dateSet(30),rerun:runDates});}
function timeline(){
  var rows=TL.slice().sort(function(a,b){return a[0]-b[0];});
  var h='<div class="qtop"><button class="back" id="x">← Til forsiden</button><div class="qtitle">Tidslinje</div><span></span></div><h1 style="font-size:32px">Alle årstal i bogen</h1><p style="color:var(--muted)">'+rows.length+' begivenheder i tidsrækkefølge. Sidetal viser, hvor i bogen det står.</p><div class="row"><button class="btn red" id="go">Test mig på årstal</button></div><ul class="tl">';
  rows.forEach(function(r){h+='<li><span class="y">'+esc(r[1])+'</span><span>'+esc(r[2])+' <span class="p">s. '+r[3]+'</span></span></li>';});
  h+='</ul>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("x").onclick=home;document.getElementById("go").onclick=runDates;
}
document.addEventListener("keydown",function(e){
  if(!Q||Q.finished||e.metaKey||e.ctrlKey||e.altKey)return;
  var it=Q.items[Q.i];
  if(it.type==="mc"&&e.key>="1"&&e.key<="4"){var k=+e.key-1;if(k<it.opts.length){choose(k);}}
  else if(e.key==="Enter"||e.key==="ArrowRight"){var nx=document.getElementById("next");if(nx&&!nx.disabled){e.preventDefault();next();}}
  else if(e.key==="ArrowLeft"&&Q.cfg.exam){go(Q.i-1);}
});
home();
})();
</script>
