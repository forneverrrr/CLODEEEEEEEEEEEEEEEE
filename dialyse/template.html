<title>Dialyse Øvebank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
/* Layout: ét smalt studiepapir-spor; hjem = tilstande + temaer, quiz = ét kort ad gangen */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --ink:#14213D; --muted:#586480; --line:#D3DAE7;
  --accent:#0B6E8A; --accent-ink:#FFFFFF; --soft:#E3E8F2;
  --ok:#1B7448; --okbg:#DCF1E4; --bad:#B3261E; --badbg:#FBE1DE;
  --f-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1324; --surface:#172036; --ink:#E7ECF6; --muted:#9BA7C2; --line:#2A3558;
    --accent:#5CC8E6; --accent-ink:#06222B; --soft:#222D4A;
    --ok:#62D393; --okbg:#12301F; --bad:#FF8F85; --badbg:#3B1815; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1324; --surface:#172036; --ink:#E7ECF6; --muted:#9BA7C2; --line:#2A3558;
  --accent:#5CC8E6; --accent-ink:#06222B; --soft:#222D4A;
  --ok:#62D393; --okbg:#12301F; --bad:#FF8F85; --badbg:#3B1815; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 96px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-feature-settings:"tnum"}
.hero{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:18px}
.hero p{color:var(--muted);max-width:56ch}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--ink)}
.mode b{font-size:18px;font-weight:700}
.mode span{font-size:14px;color:var(--muted)}
.mode.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.primary span{color:inherit;opacity:.8}
.mode.primary b::before{content:"";display:inline-block;width:10px;height:10px;background:var(--accent);margin-right:8px}
.mode[disabled]{opacity:.5;cursor:default}
.sec{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.tile .top{display:flex;gap:10px;align-items:baseline}
.tile .no{font-family:var(--f-mono);font-size:13px;color:var(--accent);min-width:2ch}
.tile .tt{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tile .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0}
.tile .acts{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--ink);background:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grp-h h3{font-size:16px;font-weight:700}
button.tile.pick{text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.tile.pick:hover{border-color:var(--ink)}
.tile.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.tile.pick .top{display:flex;gap:10px;align-items:baseline}
.tile.pick .tt{font-weight:700;line-height:1.25;overflow-wrap:anywhere;min-width:0}
.tile.pick .bar{display:block}.tile.pick .meta{display:flex;justify-content:space-between}
.cb{width:16px;height:16px;border:2px solid var(--muted);border-radius:4px;flex:none;align-self:center;display:inline-grid;place-items:center}
.pick[aria-pressed="true"] .cb{background:var(--ink);border-color:var(--ink)}
.pick[aria-pressed="true"] .cb::after{content:"";width:8px;height:4px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.settings{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.settings .lbl{font-size:13px;font-weight:700;min-width:84px;color:var(--muted)}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.startbar #sum{font-size:13px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;justify-content:space-between}
.back{background:none;border:0;padding:6px 0;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.qtitle{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:center}
.timer{font-family:var(--f-mono);font-size:15px;min-width:5ch;text-align:right}
.timer.low{color:var(--bad);font-weight:700}
.prog{display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:6px}
.prog .bar>i{background:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.src{align-self:flex-start;font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.q{font-size:clamp(19px,3.4vw,23px);font-weight:700;line-height:1.3;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;flex:none;border-radius:4px;background:var(--soft);display:grid;place-items:center;margin-top:1px}
.opt.sel{border-color:var(--ink);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default}
.fb{font-size:15px;padding:10px 12px;border-radius:8px;background:var(--soft)}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:12px 22px;font-weight:700}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.red{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11px;padding:0}
.dot.done{background:var(--soft);border-color:var(--muted)}
.dot.cur{border-color:var(--accent);border-width:2px}
/* order */
.chips{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.ev .n{font-family:var(--f-mono);width:24px;height:24px;flex:none;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px}
.ev.picked{border-color:var(--ink);background:var(--soft)}
.ev.picked .n{background:var(--ink);color:var(--bg)}
.ev .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block}
.ev.ok{border-color:var(--ok);background:var(--okbg)}
.ev.bad{border-color:var(--bad);background:var(--badbg)}
/* result */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-size:clamp(56px,14vw,96px);font-weight:800;line-height:1;letter-spacing:-.03em}
.score span{font-size:22px;color:var(--muted)}
.verdict{display:inline-block;padding:6px 14px;border-radius:6px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.verdict.pass{background:var(--okbg);color:var(--ok)}
.verdict.fail{background:var(--badbg);color:var(--bad)}
.rev{display:flex;flex-direction:column;gap:10px}
.revi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.revi::before{content:"Forkert";align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bad);background:var(--badbg);border-radius:4px;padding:1px 8px}
.revi .a{color:var(--muted);font-size:14px}.revi .a b{color:var(--ok)}
/* tidslinje */
.tl{position:relative;padding-left:3px;margin-left:6px;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
.tl li{list-style:none;display:grid;grid-template-columns:130px 1fr;gap:12px;padding:7px 0 7px 14px;position:relative;font-size:15px}
.tl li::before{content:"";position:absolute;left:-8px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.tl .y{font-family:var(--f-mono);font-size:13px;font-weight:500;padding-top:2px}
.tl .p{color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.tl ul{margin:0;padding:0}
.tl li>span:last-child{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.tl li{grid-template-columns:1fr;gap:0}}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.theme{align-self:flex-end}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap" id="app"></div>
<script>__DATA__</script>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var SHEETS=DATA.sheets;
var SRC=function(s,p){return "Kapitel "+s+" · s. "+p;};
function srcOf(it){return it.src||(it.s?SRC(it.s,it.p):"Bogen · s. "+it.p);}
var STORE_KEY="dial-ovebank-v1";
var store={stat:{},pos:0,best:null,sets:{}};
try{var raw=localStorage.getItem(STORE_KEY);if(raw){var o=JSON.parse(raw);if(o&&o.stat){store=o;if(!store.sets)store.sets={};}}}catch(e){}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}}

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
var ALL=[];
SHEETS.forEach(function(sh){sh.q.forEach(function(r,i){
  ALL.push({type:"mc",id:sh.n+":"+i,s:sh.n,q:r[0],right:r[1],wrongs:r.slice(2,r.length-1),p:r[r.length-1]});
});});
var BYID={};ALL.forEach(function(x){BYID[x.id]=x;});
function sheetItems(n){return ALL.filter(function(x){return x.s===n;});}
function rec(id,ok){var s=store.stat[id]||{c:0,w:0,l:1};if(ok)s.c++;else s.w++;s.l=ok?1:0;store.stat[id]=s;}
function mastered(){var n=0;ALL.forEach(function(x){var s=store.stat[x.id];if(s&&s.l===1)n++;});return n;}
function wrongIds(){return ALL.filter(function(x){var s=store.stat[x.id];return s&&s.l===0;});}

/* ---------- tal og grænseværdier ---------- */
function numItems(){return ALL.filter(function(x){return /\d/.test(x.right)&&x.right.length<60;});}

/* ---------- quiz engine ---------- */
var Q=null;
function startQuiz(cfg){
  var items=cfg.items.map(function(it){
    var c=Object.assign({},it);
    if(c.type==="mc"){
      var w=c.wrongs;
      if(cfg.exam)w=shuffle(w).slice(0,2);
      c.opts=shuffle([c.right].concat(w));
    }else{c.shown=shuffle(c.events);}
    return c;
  });
  Q={cfg:cfg,items:items,i:0,ans:items.map(function(){return null;}),done:items.map(function(){return false;}),t0:Date.now(),total:cfg.seconds||1800,left:cfg.exam?(cfg.seconds||1800):0,timer:null,finished:false};
  if(cfg.exam){Q.timer=setInterval(tick,1000);}
  renderQuiz();
}
function tick(){
  if(!Q||Q.finished){return;}
  Q.left=Math.max(0,Q.total-Math.floor((Date.now()-Q.t0)/1000));
  var t=document.getElementById("timer");
  if(t){t.textContent=fmt(Q.left);t.classList.toggle("low",Q.left<=300);}
  if(Q.left<=0)finish();
}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function isRight(it,a){
  if(a===null)return false;
  if(it.type==="mc")return a===it.right;
  return a.length===it.events.length&&a.every(function(e,k){return e===it.events[k][2];});
}
function renderQuiz(){
  var it=Q.items[Q.i],cfg=Q.cfg,n=Q.items.length;
  var exam=cfg.exam,done=Q.done[Q.i],a=Q.ans[Q.i];
  var h='<div class="qtop"><button class="back" id="x">← Afslut</button><div class="qtitle">'+esc(cfg.title)+'</div>'+(exam?'<div class="timer" id="timer">'+fmt(Q.left)+'</div>':'<div class="timer mono">'+(Q.i+1)+'/'+n+'</div>')+'</div>';
  h+='<div class="prog"><div class="bar"><i style="width:'+Math.round((Q.i+(done?1:0))/n*100)+'%"></i></div>'+(exam?'<span class="mono" style="font-size:13px">'+(Q.i+1)+'/'+n+'</span>':'')+'</div>';
  h+='<div class="card"><div class="q" id="qq">'+esc(it.q)+'</div>';
  if(!exam&&it.type==="mc"&&done)h+='<div class="src">'+esc(srcOf(it))+'</div>';
  if(it.type==="mc"){
    h+='<div class="opts" role="group" aria-label="Svarmuligheder">';
    it.opts.forEach(function(o,k){
      var cls="opt";
      if(exam){if(a===o)cls+=" sel";}
      else if(done){if(o===it.right)cls+=" ok";else if(o===a)cls+=" bad";}
      h+='<button class="'+cls+'" data-o="'+k+'"'+((!exam&&done)?' disabled':'')+'><span class="k">'+"ABCD"[k]+'</span><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
    if(!exam&&done){
      var ok=a===it.right;
      h+='<div class="fb '+(ok?'ok':'bad')+'" role="status">'+(ok?'<b>Rigtigt.</b>':'<b>Forkert.</b> Rigtigt svar: '+esc(it.right))+'</div>';
      if(it.dates){h+='<div class="fb">'+it.dates.map(function(d){return esc(d[1])+' – '+esc(d[2]);}).join('<br>')+'</div>';}
    }
  }else{
    var picked=a||[];
    h+='<div class="chips">';
    it.shown.forEach(function(e){
      var pos=picked.indexOf(e[2]);
      var cls="ev"+(pos>=0?" picked":"");
      if(!exam&&done){cls="ev "+(picked[it.events.indexOf(e)]===e[2]?"ok":"bad");}
      var num=(!exam&&done)?String(it.events.indexOf(e)+1):(pos>=0?String(pos+1):"");
      h+='<button class="'+cls+'" data-e="'+esc(e[2])+'"'+((!exam&&done)?' disabled':'')+'><span class="n">'+num+'</span><span>'+esc(e[2])+((!exam&&done)?'<span class="d">'+esc(e[1])+'</span>':'')+'</span></button>';
    });
    h+='</div>';
    if(!(done&&!exam)){h+='<div class="row"><button class="btn ghost" id="clr">Ryd</button>'+(exam?'':'<button class="btn" id="chk"'+(picked.length===it.events.length?'':' disabled')+'>Tjek rækkefølge</button>')+'</div>';}
    else{var ok2=isRight(it,a);h+='<div class="fb '+(ok2?'ok':'bad')+'" role="status">'+(ok2?'<b>Rigtigt.</b>':'<b>Forkert.</b> Den rigtige rækkefølge ses i tallene ovenfor.')+'</div>';}
  }
  h+='</div>';
  h+='<div class="nav">';
  if(exam){
    h+='<button class="btn ghost" id="prev"'+(Q.i===0?' disabled':'')+'>← Forrige</button>';
    if(Q.i<n-1)h+='<button class="btn" id="next">Næste →</button>';
    else h+='<button class="btn red" id="fin">Aflever prøven</button>';
  }else{
    h+='<span></span>';
    var can=it.type==="mc"?done:done;
    h+='<button class="btn" id="next"'+(can?'':' disabled')+'>'+(Q.i<n-1?'Næste →':'Se resultat')+'</button>';
  }
  h+='</div>';
  if(exam){
    h+='<div class="dots">';
    Q.items.forEach(function(x,k){h+='<button class="dot'+(Q.ans[k]!==null?' done':'')+(k===Q.i?' cur':'')+'" data-j="'+k+'" aria-label="Spørgsmål '+(k+1)+'">'+(k+1)+'</button>';});
    h+='</div>';
  }
  app.innerHTML=h;
  bindQuiz();
}
function bindQuiz(){
  var it=Q.items[Q.i],exam=Q.cfg.exam;
  document.getElementById("x").onclick=function(){if(Q.timer)clearInterval(Q.timer);Q=null;home();};
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){choose(+b.getAttribute("data-o"));};});
  Array.prototype.forEach.call(app.querySelectorAll(".ev"),function(b){b.onclick=function(){pickEv(b.getAttribute("data-e"));};});
  var nx=document.getElementById("next");if(nx)nx.onclick=next;
  var pv=document.getElementById("prev");if(pv)pv.onclick=function(){go(Q.i-1);};
  var fn=document.getElementById("fin");if(fn)fn.onclick=function(){confirmFinish();};
  var cl=document.getElementById("clr");if(cl)cl.onclick=function(){Q.ans[Q.i]=null;renderQuiz();};
  var ck=document.getElementById("chk");if(ck)ck.onclick=function(){grade();};
  Array.prototype.forEach.call(app.querySelectorAll(".dot"),function(b){b.onclick=function(){go(+b.getAttribute("data-j"));};});
}
function go(k){if(k>=0&&k<Q.items.length){Q.i=k;renderQuiz();window.scrollTo(0,0);}}
function choose(k){
  var it=Q.items[Q.i];if(Q.cfg.exam){Q.ans[Q.i]=it.opts[k];renderQuiz();return;}
  if(Q.done[Q.i])return;
  Q.ans[Q.i]=it.opts[k];Q.done[Q.i]=true;
  var ok=it.opts[k]===it.right;if(!it.nostat)rec(it.id,ok);save();renderQuiz();
}
function pickEv(name){
  if(!Q.cfg.exam&&Q.done[Q.i])return;
  var a=(Q.ans[Q.i]||[]).slice(),k=a.indexOf(name);
  if(k>=0)a.splice(k,1);else a.push(name);
  Q.ans[Q.i]=a.length?a:null;renderQuiz();
}
function grade(){Q.done[Q.i]=true;renderQuiz();}
function next(){
  if(Q.cfg.exam){go(Q.i+1);return;}
  if(!Q.done[Q.i])return;
  if(Q.i<Q.items.length-1){Q.i++;if(Q.cfg.saveOrder){store.pos=Q.cfg.base+Q.i;save();}renderQuiz();window.scrollTo(0,0);}
  else finish();
}
function confirmFinish(){
  var un=Q.ans.filter(function(x){return x===null;}).length;
  if(!un){finish();return;}
  var b=document.getElementById("fin");
  if(b.getAttribute("data-c")){finish();return;}
  b.setAttribute("data-c","1");b.textContent=un+" ubesvarede. Aflever alligevel?";
}
function finish(){
  if(!Q||Q.finished)return;
  Q.finished=true;if(Q.timer)clearInterval(Q.timer);
  var wrong=[],right=0;
  Q.items.forEach(function(it,k){
    var ok=isRight(it,Q.ans[k]);
    if(ok)right++;else wrong.push(it);
    if(Q.cfg.exam&&!it.nostat)rec(it.id,ok);
  });
  var n=Q.items.length,pct=Math.round(right/n*100);
  if(Q.cfg.setName){var ps=store.sets[Q.cfg.setName];if(ps===undefined||pct>ps)store.sets[Q.cfg.setName]=pct;}
  if(Q.cfg.exam){var prev=store.best;if(prev===null||pct>prev)store.best=pct;}
  if(Q.cfg.saveOrder&&Q.i>=n-1)store.pos=0;
  save();
  var pass=Q.cfg.exam?right>=Math.ceil(n*0.8):null;
  var h='<div class="qtop"><button class="back" id="x">← Til forsiden</button><div class="qtitle">'+esc(Q.cfg.title)+'</div><span></span></div>';
  h+='<div class="card"><div class="score"><b class="mono">'+right+'</b><span>af '+n+' rigtige · '+pct+'%</span></div>';
  if(pass!==null)h+='<div><span class="verdict '+(pass?'pass':'fail')+'">'+(pass?'Bestået':'Ikke bestået')+'</span> <span style="color:var(--muted);font-size:14px">Kravet er mindst '+Math.ceil(n*0.8)+' rigtige af '+n+'.</span></div>';
  h+='<div class="row">';
  if(wrong.length)h+='<button class="btn red" id="rw">Øv de '+wrong.length+' fejl igen</button>';
  h+='<button class="btn ghost" id="again">Ny omgang</button></div></div>';
  if(wrong.length){
    h+='<h2>Dine fejl</h2><div class="rev">';
    wrong.forEach(function(it){
      var k=Q.items.indexOf(it),a=Q.ans[k];
      h+='<div class="revi"><div><b>'+esc(it.q)+'</b></div>';
      if(it.type==="mc")h+='<div class="a">Du svarede: '+esc(a===null?"(intet svar)":a)+'<br>Rigtigt: <b>'+esc(it.right)+'</b></div><div class="src">'+esc(srcOf(it))+'</div>';
      else h+='<div class="a">Rigtig rækkefølge:<br><b>'+it.events.map(function(e,j){return (j+1)+'. '+esc(e[2])+' ('+esc(e[1])+')';}).join('<br>')+'</b></div>';
      h+='</div>';
    });
    h+='</div>';
  }
  app.innerHTML=h;window.scrollTo(0,0);
  var cfg=Q.cfg;
  document.getElementById("x").onclick=function(){Q=null;home();};
  var rw=document.getElementById("rw");
  if(rw)rw.onclick=function(){startQuiz({title:"Fejl fra sidste omgang",items:shuffle(wrong.map(function(x){return stripGen(x);})),exam:false});};
  document.getElementById("again").onclick=function(){cfg.rerun?cfg.rerun():home();};
}
function stripGen(x){var c=Object.assign({},x);delete c.opts;delete c.shown;return c;}

/* ---------- screens ---------- */
function home(){
  Q=null;
  var total=ALL.length,m=mastered(),wr=wrongIds().length;
  var h='<button class="chip theme" id="th" aria-label="Skift lys/mørk">Lys / mørk</button>';
  h+='<header class="hero"><h1>Dialyse Øvebank</h1><p>Øvebank til lærebogen »Dialyse« (4. udgave, 2023). Alle 29 kapitler: akut og kronisk nyresvigt, PD, HD, adgangsveje, komplikationer, børn, transplantation, MMU, palliation og sociale rettigheder.</p>';
  h+='<div class="stats"><div class="stat"><b class="mono">'+total+'</b><span>spørgsmål</span></div><div class="stat"><b class="mono">'+SHEETS.length+'</b><span>kapitler</span></div><div class="stat"><b class="mono">'+m+'</b><span>besvaret rigtigt sidst</span></div>'+(store.best!==null?'<div class="stat"><b class="mono">'+store.best+'%</b><span>bedste prøve</span></div>':'')+'</div></header>';
  h+='<section class="sec"><h2>Vælg tilstand</h2><div class="modes">';
  h+='<button class="mode primary" id="m-exam"><b>Prøve som til eksamen</b><span>25 spørgsmål fra hele bogen, 30 minutter, 3 svarmuligheder. 20 rigtige for at bestå (øvelsesformat, ikke officielt).</span></button>';
  h+='<button class="mode" id="m-seq"><b>Hele bogen i rækkefølge</b><span>'+(store.pos>0&&store.pos<total?'Fortsæt ved spørgsmål '+(store.pos+1)+' af '+total+'.':'Fra kapitel 1 til kapitel 29, alle '+total+' spørgsmål.')+'</span></button>';
  h+='<button class="mode" id="m-shuf"><b>Hele bogen blandet</b><span>Tilfældig rækkefølge på tværs af alle emner. Vælg længde nedenfor.</span></button>';
  h+='<button class="mode" id="m-date"><b>Tal og grænseværdier</b><span>Kun spørgsmål, hvor svaret er et tal: værdier, doser, procenter og årstal.</span></button>';
  h+='<button class="mode" id="m-wr"'+(wr?'':' disabled')+'><b>Mine fejl</b><span>'+(wr?wr+' spørgsmål, du svarede forkert på sidst.':'Ingen fejl endnu. De samles her.')+'</span></button>';
  h+='</div><div class="row"><span style="font-size:14px;color:var(--muted)">Længde på blandet:</span><div class="picker" id="len">';
  [25,50,100,0].forEach(function(n){h+='<button class="chip" data-n="'+n+'" aria-pressed="'+((n===(window.__len||50))?'true':'false')+'">'+(n||'Alle '+total)+'</button>';});
  h+='</div></div></section>';
  h+='<section class="sec"><h2>Færdige prøver, 25 spørgsmål hver</h2><p style="color:var(--muted);font-size:14px">Hver prøve har faste spørgsmål i blandet rækkefølge fra næsten alle kapitler. Ingen spørgsmål gentages mellem Prøve 1-12. »Som eksamen« giver 30 minutter og 3 svarmuligheder med svar til sidst. »Øv« viser svaret med det samme.</p><div class="tiles">';
  DATA.sets.forEach(function(st,k){
    var b=store.sets[st.name];
    h+='<div class="tile"><div class="top"><span class="no">'+(st.kind==="official"?'OFF':String(k).padStart(2,"0"))+'</span><span class="tt">'+esc(st.name)+'</span></div><div class="bar"><i style="width:'+(b||0)+'%"></i></div><div class="meta"><span>'+st.items.length+' spørgsmål</span><span>'+(b===undefined?'ikke prøvet':'bedst '+b+'%')+'</span></div><div class="acts"><button class="chip" data-set="'+k+'" data-x="1">Som eksamen</button><button class="chip" data-set="'+k+'" data-x="0">Øv</button></div></div>';
  });
  h+='</div></section>';
  h+=builderHtml();
  h+='<p class="foot">Spørgsmålene er udarbejdet ud fra lærebogen »Dialyse« (4. udgave, 2023) og er ikke kvalitetssikret af bogens forfattere. Prøveformatet (25 spørgsmål, 30 minutter, mindst 20 rigtige) er kopieret fra medborgerprøven og er kun et øvelsesformat. Brug ikke siden til klinisk beslutningstagning; tjek altid gældende vejledninger. Din fremgang gemmes kun i denne browser.</p>';
  app.innerHTML=h;
  document.getElementById("th").onclick=function(){
    var r=document.documentElement,cur=r.getAttribute("data-theme");
    var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme",dark?"light":"dark");
  };
  Array.prototype.forEach.call(document.querySelectorAll("#len .chip"),function(b){b.onclick=function(){window.__len=+b.getAttribute("data-n");home();};});
  document.getElementById("m-exam").onclick=runExam;
  document.getElementById("m-seq").onclick=function(){
    var base=(store.pos>0&&store.pos<total)?store.pos:0;
    startQuiz({title:"Hele bogen i rækkefølge",items:ALL.slice(base),saveOrder:true,base:base,rerun:function(){store.pos=0;save();home();}});
  };
  document.getElementById("m-shuf").onclick=runShuffle;
  document.getElementById("m-date").onclick=runNums;
  var wb=document.getElementById("m-wr");if(!wb.disabled)wb.onclick=function(){startQuiz({title:"Mine fejl",items:shuffle(wrongIds()),rerun:home});};
  Array.prototype.forEach.call(document.querySelectorAll("[data-set]"),function(b){b.onclick=function(){
    var st=DATA.sets[+b.getAttribute("data-set")],ex=b.getAttribute("data-x")==="1";
    startQuiz({title:st.name+(ex?"":" · øv"),items:st.items.map(function(x){return Object.assign({type:"mc"},x);}),exam:ex,setName:st.name,rerun:function(){b.onclick();}});
  };});
  bindBuilder();
}
var GROUPS=[["Grundlag og behandlingsvalg",[1,2,3,4]],["Peritonealdialyse",[5,6]],["Hæmodialyse og adgangsveje",[7,8,9,10]],["Komplikationer og følgesygdomme",[11,12,13,14]],["Ernæring, hormoner og medicin",[15,16,17,18,19]],["Særlige patientgrupper",[20,21,22]],["Aferese og forgiftninger",[23,24]],["Transplantation",[25,26]],["Livets afslutning og sociale forhold",[27,28,29]]];
if(!store.sel)store.sel=[];
if(!store.bset)store.bset={order:"seq",n:0,mode:"practice"};
function isSel(n){return store.sel.indexOf(n)>=0;}
function builderHtml(){
  var h='<section class="sec" id="builder"><h2>Vælg emner</h2><p style="color:var(--muted);font-size:14px">Tryk på et eller flere emner. Vælg derefter rækkefølge, antal og tilstand nederst, og tryk Start.</p><div class="row"><button class="chip" id="sel-all">Vælg alle</button><button class="chip" id="sel-none">Fravælg alle</button></div>';
  GROUPS.forEach(function(g,gi){
    h+='<div class="grp"><div class="grp-h"><h3>'+esc(g[0])+'</h3><button class="chip" data-g="'+gi+'">Vælg gruppen</button></div><div class="tiles">';
    g[1].forEach(function(n){
      var sh=SHEETS.filter(function(x){return x.n===n;})[0],its=sheetItems(n);
      var ok=its.filter(function(x){var t=store.stat[x.id];return t&&t.l===1;}).length;
      h+='<button class="tile pick" data-s="'+n+'" aria-pressed="'+(isSel(n)?'true':'false')+'"><span class="top"><span class="cb" aria-hidden="true"></span><span class="no">'+String(n).padStart(2,"0")+'</span><span class="tt">'+esc(sh.title)+'</span></span><span class="bar"><i style="width:'+Math.round(ok/its.length*100)+'%"></i></span><span class="meta"><span>'+its.length+' spørgsmål</span><span>s. '+sh.pages+'</span></span></button>';
    });
    h+='</div></div>';
  });
  var bs=store.bset;
  function pk(name,opts,cur){return '<div class="row"><span class="lbl">'+({order:"Rækkefølge",n:"Antal",mode:"Tilstand"})[name]+'</span><div class="picker" data-p="'+name+'">'+opts.map(function(o){return '<button class="chip" data-v="'+o[0]+'" aria-pressed="'+(String(cur)===String(o[0])?'true':'false')+'">'+o[1]+'</button>';}).join("")+'</div></div>';}
  h+='<div class="settings">'+pk("order",[["seq","I bogens rækkefølge"],["shuf","Blandet"]],bs.order)+pk("n",[[10,"10"],[25,"25"],[50,"50"],[100,"100"],[0,"Alle valgte"]],bs.n)+pk("mode",[["practice","Øv: svar med det samme"],["exam","Som eksamen: tid, svar til sidst"]],bs.mode)+'</div>';
  h+='</section><div class="startbar"><span id="sum" class="mono"></span><button class="btn red" id="go-sel">Start</button></div>';
  return h;
}
function selCount(){var c=0;store.sel.forEach(function(n){c+=sheetItems(n).length;});return c;}
function updSum(){
  var c=selCount(),n=store.bset.n,use=n&&n<c?n:c;
  var sm=document.getElementById("sum"),go=document.getElementById("go-sel");
  if(!sm)return;
  sm.textContent=store.sel.length?store.sel.length+" emner · "+use+" af "+c+" spørgsmål":"Ingen emner valgt";
  go.disabled=!store.sel.length;
}
function bindBuilder(){
  Array.prototype.forEach.call(document.querySelectorAll(".pick"),function(b){b.onclick=function(){
    var n=+b.getAttribute("data-s"),k=store.sel.indexOf(n);
    if(k>=0)store.sel.splice(k,1);else store.sel.push(n);
    b.setAttribute("aria-pressed",k>=0?"false":"true");save();updSum();
  };});
  function setAll(arr){store.sel=arr.slice();Array.prototype.forEach.call(document.querySelectorAll(".pick"),function(b){b.setAttribute("aria-pressed",isSel(+b.getAttribute("data-s"))?"true":"false");});save();updSum();}
  document.getElementById("sel-all").onclick=function(){setAll(SHEETS.map(function(x){return x.n;}));};
  document.getElementById("sel-none").onclick=function(){setAll([]);};
  Array.prototype.forEach.call(document.querySelectorAll("[data-g]"),function(b){b.onclick=function(){
    var g=GROUPS[+b.getAttribute("data-g")][1],all=g.every(isSel);
    var cur=store.sel.filter(function(n){return g.indexOf(n)<0;});
    setAll(all?cur:cur.concat(g));
  };});
  Array.prototype.forEach.call(document.querySelectorAll(".picker[data-p]"),function(p){
    var key=p.getAttribute("data-p");
    Array.prototype.forEach.call(p.querySelectorAll(".chip"),function(b){b.onclick=function(){
      var v=b.getAttribute("data-v");store.bset[key]=key==="n"?+v:v;
      Array.prototype.forEach.call(p.querySelectorAll(".chip"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
      save();updSum();
    };});
  });
  document.getElementById("go-sel").onclick=startSel;
  updSum();
}
function startSel(){
  if(!store.sel.length)return;
  var nums=store.sel.slice().sort(function(a,b){return a-b;}),items=[];
  nums.forEach(function(n){items=items.concat(sheetItems(n));});
  var bs=store.bset;
  if(bs.order==="shuf")items=shuffle(items);
  if(bs.n&&bs.n<items.length)items=items.slice(0,bs.n);
  var ex=bs.mode==="exam";
  var title=nums.length===1?"Kapitel "+nums[0]:"Egne emner ("+nums.length+")";
  startQuiz({title:title,items:items,exam:ex,seconds:Math.max(60,items.length*72),rerun:startSel});
}
function runExam(){
  var pick=[];
  var pool=shuffle(SHEETS.map(function(s){return s.n;}));
  pool.slice(0,25).forEach(function(n){var its=shuffle(sheetItems(n));pick.push(its[0]);});
  startQuiz({title:"Prøve",items:shuffle(pick),exam:true,rerun:runExam});
}
function runShuffle(){
  var n=window.__len===undefined?50:window.__len;
  var items=shuffle(ALL);if(n)items=items.slice(0,n);
  startQuiz({title:"Hele bogen blandet",items:items,rerun:runShuffle});
}
function runNums(){var n=window.__len===undefined?50:window.__len;var items=shuffle(numItems());if(n)items=items.slice(0,n);startQuiz({title:"Tal og grænseværdier",items:items,rerun:runNums});}
document.addEventListener("keydown",function(e){
  if(!Q||Q.finished||e.metaKey||e.ctrlKey||e.altKey)return;
  var it=Q.items[Q.i];
  if(it.type==="mc"&&e.key>="1"&&e.key<="4"){var k=+e.key-1;if(k<it.opts.length){choose(k);}}
  else if(e.key==="Enter"||e.key==="ArrowRight"){var nx=document.getElementById("next");if(nx&&!nx.disabled){e.preventDefault();next();}}
  else if(e.key==="ArrowLeft"&&Q.cfg.exam){go(Q.i-1);}
});
home();
})();
</script>
